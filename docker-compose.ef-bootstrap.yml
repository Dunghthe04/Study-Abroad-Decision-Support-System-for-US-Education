# Postgres chỉ dùng cho bootstrap EF (KHÔNG mount database/init).
# Dùng cùng scripts/bootstrap-full-database.ps1 — tránh init SQL chạy trước EF gây lệch schema.
name: usas

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyabroad}
      POSTGRES_USER: ${POSTGRES_USER:-studyabroad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyabroad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
