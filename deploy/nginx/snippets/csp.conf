# Content-Security-Policy: lớp chặn thứ hai khi có script lạ chạy trong trang (thư viện npm bị chèn mã, code sau này render HTML).
# Đã thử Report-Only trên Docker local (27/11) không thấy vi phạm nên để chặn thật.
# script-src/style-src cần 'unsafe-inline' vì Next.js App Router chèn script inline và chart.tsx chèn thẻ <style>.
# img-src mở https: vì ảnh trong chat tư vấn lấy từ link bất kỳ trong kho tri thức; blob: cho ảnh xem trước trước khi gửi; data: cho icon SVG của emoji-picker-react ở chat cộng đồng.
# frame-src blob: cho minh chứng ngày sinh dạng PDF admin xem trong iframe (tải về thành blob rồi mới hiện).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; frame-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
