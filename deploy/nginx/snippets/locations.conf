# Shared routing used by both the production (HTTPS) and the local (HTTP) proxy.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# LLM answers can take a while on CPU.
location /api/v1/advisor/ {
    limit_req zone=advisor burst=5 nodelay;
    proxy_read_timeout 300s;
    proxy_pass http://api_upstream;
}

# Gợi ý trường: CRM + LLM viết lý do mất 1-2 phút trên GPU nhỏ.
location /api/v1/recommendations {
    limit_req zone=advisor burst=5 nodelay;
    proxy_read_timeout 300s;
    proxy_pass http://api_upstream;
}

# Upload bảng điểm: OCR chiếm GPU lâu (BE chờ tối đa Advisor:OcrTimeoutSeconds = 600s).
# Tệp ≤ 10MB + phần đầu multipart; giới hạn tần suất theo IP (BE còn giới hạn theo từng user).
location = /api/v1/profile/flow/draft/upload-transcript {
    limit_req zone=advisor burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 11m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://api_upstream;
}

location /api/ {
    proxy_pass http://api_upstream;
}

location /swagger {
    proxy_pass http://api_upstream;
}

location /health/ {
    proxy_pass http://api_upstream;
}

location / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://web_upstream;
}
