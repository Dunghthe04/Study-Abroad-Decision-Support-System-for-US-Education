# Local development stack.
#   Only infrastructure (run apps from IDE):  docker compose up -d db ollama ollama-init
#   Full stack in containers:                 docker compose up -d --build   -> http://localhost:8088
name: usas

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyabroad}
      POSTGRES_USER: ${POSTGRES_USER:-studyabroad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyabroad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment if the machine has an NVIDIA GPU + NVIDIA Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # One-shot job: pulls the LLM and the embedding model into the ollama volume.
  ollama-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:8b} && ollama pull ${EMBEDDING_MODEL:-bge-m3}"]
    restart: "no"

  advisor:
    build: ./advisor
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: development
      API_KEY: ${ADVISOR_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyabroad}:${POSTGRES_PASSWORD:-studyabroad}@db:5432/${POSTGRES_DB:-studyabroad}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    ports:
      - "8000:8000"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-studyabroad};Username=${POSTGRES_USER:-studyabroad};Password=${POSTGRES_PASSWORD:-studyabroad}
      Advisor__BaseUrl: http://advisor:8000
      Advisor__ApiKey: ${ADVISOR_API_KEY:-}
      Cors__AllowedOrigins__0: http://localhost:3000
      Jwt__SecretKey: ${JWT_SECRET_KEY:-usas_dev_jwt_secret_key_minimum_32_characters_for_local_development_2026!}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-USAS - Study Abroad Support}
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"

  # Same routing as production Nginx (/api -> api, / -> web), without TLS.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro

volumes:
  pgdata:
  ollama:
