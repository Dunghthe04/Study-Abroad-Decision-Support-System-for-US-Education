# Local proxy for the full Docker dev stack: http://localhost:8088 (same routing as production, no TLS).

limit_req_zone $binary_remote_addr zone=advisor:10m rate=30r/m;

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    include /etc/nginx/snippets/locations.conf;
}
