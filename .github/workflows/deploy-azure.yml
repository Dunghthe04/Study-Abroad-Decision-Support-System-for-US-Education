name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - advisor
  push:
    branches:
      - feature/USAS-2097-set-up-deployment-test-server
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: usasreg.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend image
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'backend' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            usasreg.azurecr.io/usas-backend:${{ github.sha }}
            usasreg.azurecr.io/usas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Advisor image
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'advisor' }}
        uses: docker/build-push-action@v6
        with:
          context: ./advisor
          file: ./advisor/Dockerfile
          push: true
          tags: |
            usasreg.azurecr.io/usas-advisor:${{ github.sha }}
            usasreg.azurecr.io/usas-advisor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'frontend' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            usasreg.azurecr.io/usas-frontend:${{ github.sha }}
            usasreg.azurecr.io/usas-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Container App
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'backend' }}
        run: |
          az containerapp update \
            --name usas-backend \
            --resource-group usas-rg \
            --image usasreg.azurecr.io/usas-backend:${{ github.sha }}

      - name: Deploy Advisor to Container App
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'advisor' }}
        run: |
          az containerapp update \
            --name usas-advisor \
            --resource-group usas-rg \
            --image usasreg.azurecr.io/usas-advisor:${{ github.sha }}

      - name: Deploy Frontend to Container App
        if: ${{ github.event_name == 'push' || inputs.service == 'all' || inputs.service == 'frontend' }}
        run: |
          az containerapp update \
            --name usas-frontend \
            --resource-group usas-rg \
            --image usasreg.azurecr.io/usas-frontend:${{ github.sha }}
